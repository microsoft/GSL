name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Build Dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake git make ninja-build

      - name: Configure CMake (C++14)
        run: cmake --preset clang-14-debug -DCI_TESTING:BOOL=ON

      - name: Configure CMake (C++20)
        run: cmake --preset clang-20-debug -DCI_TESTING:BOOL=ON
